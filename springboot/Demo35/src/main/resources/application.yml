# 应用服务 WEB 访问端口
server:
  port: 8080
  address: 0.0.0.0
  servlet:
    context-path: /
    jsp:
      init:
        development: true
  tomcat:
    additional-tld-skip-patterns:
      - "javacpp-*.jar"
      - "hadoop-*.jar"
      - "tachyon-*.jar"
      - "derbyLocale_*.jar"
      - "derbyshared.jar"
      - "tesseract-*.jar"

spring:
  # 敏感配置统一放在项目根目录的 .env 中（该文件不会上传到 GitHub），
  # 这里自动加载它；Docker 场景下由环境变量注入（优先级更高）。
  config:
    import: optional:file:${YUANJI_ENV_FILE:../../.env}[.properties]
  main:
    allow-bean-definition-overriding: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    url: "${DB_URL:jdbc:mysql://localhost:3306/yuanji?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true}"
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:hadoop1:9092,hadoop2:9092,hadoop3:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: dashboard-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

recommend:
  default:
    limit: 20

bigdata:
  enabled: false  # 是否启用大数据模块，false不启动，true启动

redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  lettuce:
    pool:
      max-active: 8
      max-idle: 8
      min-idle: 0
  connect-timeout: 5000ms
  timeout: 5000ms

hbase:
  zookeeper:
    quorum: ${HBASE_ZK_QUORUM:hadoop1,hadoop2,hadoop3}
    port: ${HBASE_ZK_PORT:2181}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.item.demo35.entity

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}


#=============================================================================
alipay:
  # 沙箱环境配置
  app-id: ${ALIPAY_APP_ID}
  # 商户私钥
  merchant-private-key: ${ALIPAY_MERCHANT_PRIVATE_KEY}
  # 支付宝公钥
  alipay-public-key: ${ALIPAY_PUBLIC_KEY}
  # 沙箱网关
  gateway-url: ${ALIPAY_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
  # 异步通知地址（需要内网穿透）
  notify-url: ${ALIPAY_NOTIFY_URL:}
  # 同步跳转地址（支付完成后前端跳转）
  return-url: "${ALIPAY_RETURN_URL:http://localhost:8080/#/pay/result}"
  # 签名类型
  sign-type: RSA2
  # 格式
  format: json
  # 字符集
  charset: UTF-8
  #===========================================================

# 阿里云 OSS：AccessKey 不再硬编码，由 .env / 环境变量注入
oss:
  endpoint: ${OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
  access-key-id: ${OSS_ACCESS_KEY_ID}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET}
  bucket: ${OSS_BUCKET:cvv-springboot-test}

anythingllm:
  # AnythingLLM 服务地址（默认端口 3001）
  base-url: ${ANYTHINGLLM_BASE_URL:http://localhost:3001}
  # API Key（在 AnythingLLM 设置 → API Keys 中获取）
  api-key: ${ANYTHINGLLM_API_KEY}
  # 运动知识库的工作区名称
  workspace-slug: ${ANYTHINGLLM_WORKSPACE_SLUG}

# Python AI 姿态分析服务地址（Docker 下指向服务名，如 http://ai:5002/api/analyze/frame）
python:
  api:
    url: ${PYTHON_API_URL:http://localhost:5002/api/analyze/frame}

logging:
  level:
    com.example: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/application.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 500MB