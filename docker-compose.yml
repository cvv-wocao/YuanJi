# 敏感配置统一放在根目录 .env（已被 .gitignore 忽略，不会上传到 GitHub）。
# 使用前：cp .env.example .env 并填好真实值，然后
#     docker compose up -d --build
#
# 组成：backend（Spring Boot :8080）+ ai（Python 姿态分析 :5002）
#
# MySQL / Redis 复用宿主机上已有的服务（通过 host.docker.internal 访问）：
# 本机 3306 / 6379 已被占用，而且业务数据就在宿主机的 yuanji 库里。
# 想要一套自包含的 MySQL / Redis，见文件末尾注释块。
#
# 注意：YOLO 模型 best.pt 未纳入 Git 仓库，需要本机存在 YOLO/best.pt，见下方挂载。
name: rumbing

services:
  ai:
    build: ./running
    environment:
      # 只注入 AI 服务真正需要的变量
      JWT_SECRET: ${JWT_SECRET}
      SPARK_APP_ID: ${SPARK_APP_ID}
      SPARK_API_KEY: ${SPARK_API_KEY}
      SPARK_API_SECRET: ${SPARK_API_SECRET}
      SPARK_URL: ${SPARK_URL:-wss://spark-api.xf-yun.com/v1/x1}
      SPARK_DOMAIN: ${SPARK_DOMAIN:-x1}
    volumes:
      # RunningPoseModule 按 <项目根>/YOLO/best.pt 找模型；容器内项目根为 /
      - ./YOLO/best.pt:/YOLO/best.pt:ro
    ports:
      - "5002:5002"

  backend:
    build: ./springboot/Demo35
    env_file:
      - .env
    environment:
      # 覆盖 .env 里的 localhost / 内网地址
      DB_URL: jdbc:mysql://host.docker.internal:3306/yuanji?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true
      REDIS_HOST: host.docker.internal
      PYTHON_API_URL: http://ai:5002/api/analyze/frame
      PYTHON_API_BASE_URL: http://ai:5002
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    depends_on:
      - ai

