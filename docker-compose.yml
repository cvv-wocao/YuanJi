# 敏感配置统一放在根目录 .env（已被 .gitignore 忽略，不会上传到 GitHub）。
# 使用前：cp .env.example .env 并填好真实值，然后
#     docker compose up -d --build
#
# 说明：
# - 容器之间互相访问使用服务名（mysql / redis / ai），下面用 environment 覆盖 .env 里的 localhost。
# - 按最小权限注入：只有 backend 使用整个 .env，ai / mysql 只拿到自己需要的那几个变量。
# - 数据库表结构未随仓库提供（仓库内只有 long_term_memory.sql），首次启动后需自行导入。
# - AI 服务的 SQLite 数据（running.db）保存在容器内，重建容器会丢失。
name: rumbing

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: yuanji
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  ai:
    build: ./running
    environment:
      # 只注入 AI 服务真正需要的变量
      JWT_SECRET: ${JWT_SECRET}
      SPARK_APP_ID: ${SPARK_APP_ID}
      SPARK_API_KEY: ${SPARK_API_KEY}
      SPARK_API_SECRET: ${SPARK_API_SECRET}
      SPARK_URL: ${SPARK_URL:-wss://spark-api.xf-yun.com/v1/x1}
      SPARK_DOMAIN: ${SPARK_DOMAIN:-x1}
    ports:
      - "5002:5002"

  backend:
    build: ./springboot/Demo35
    env_file:
      - .env
    environment:
      # 覆盖 .env 中的 localhost / 内网地址，改为容器服务名
      DB_URL: jdbc:mysql://mysql:3306/yuanji?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true
      REDIS_HOST: redis
      PYTHON_API_URL: http://ai:5002/api/analyze/frame
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      ai:
        condition: service_started

volumes:
  mysql-data:
  redis-data: